apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-config
  namespace: workflow-pipeline
data:
  LLM_PROVIDER: openai_compatible
  LLM_BASE_URL: https://api.example.com/v1
  LLM_MODEL: default-model
  PROMPT_TO_CODE_LLM_MODEL: code-model
  OBJECT_STORAGE_PROVIDER: s3_compatible
  OBJECT_STORAGE_ENDPOINT: s3.amazonaws.com
  OBJECT_STORAGE_BUCKET: workflow-artifacts-prod
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_SECURE: "true"
