apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-db-migrations
  namespace: workflow-pipeline
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: workflow-db-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: workflow-pipeline/migrations:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: workflow-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
