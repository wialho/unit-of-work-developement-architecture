apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workflow-pipeline

resources:
  - configmap.yaml
  - migration-job.yaml
  - services.yaml
  - hpa.yaml
  - pdb.yaml

images:
  - name: workflow-pipeline/orchestrator
    newName: registry.example.com/workflow-pipeline/orchestrator
    newTag: 0.1.0
  - name: workflow-pipeline/ticket-to-prompt
    newName: registry.example.com/workflow-pipeline/ticket-to-prompt
    newTag: 0.1.0
  - name: workflow-pipeline/prompt-to-code
    newName: registry.example.com/workflow-pipeline/prompt-to-code
    newTag: 0.1.0
  - name: workflow-pipeline/code-review
    newName: registry.example.com/workflow-pipeline/code-review
    newTag: 0.1.0
  - name: workflow-pipeline/analysis
    newName: registry.example.com/workflow-pipeline/analysis
    newTag: 0.1.0
  - name: workflow-pipeline/migrations
    newName: registry.example.com/workflow-pipeline/migrations
    newTag: 0.1.0
