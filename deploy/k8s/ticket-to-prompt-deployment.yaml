apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-to-prompt
  namespace: workflow-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-to-prompt
  template:
    metadata:
      labels:
        app: ticket-to-prompt
    spec:
      containers:
        - name: ticket-to-prompt
          image: workflow-pipeline/ticket-to-prompt:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: ticket-to-prompt
          envFrom:
            - configMapRef:
                name: workflow-config
            - secretRef:
                name: workflow-secrets
